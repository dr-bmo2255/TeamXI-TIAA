<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIAA | Build Your Family's Future</title>
<meta name="description" content="A simple bilingual calculator and game that shows how saving early builds security for your family and for generations.">
<style>
  :root{
    --navy:#0b2a4a;
    --navy-2:#123a63;
    --teal:#00a3ad;
    --teal-2:#4fd1d9;
    --gold:#f2a900;
    --bg:#f4f7fa;
    --card:#ffffff;
    --ink:#14212e;
    --muted:#5b6b7b;
    --line:#dde5ec;
    --good:#1f9d63;
    --bad:#c8443a;
    --break:#f6e7c8;
    --radius:14px;
    --shadow:0 1px 2px rgba(11,42,74,.06),0 6px 20px rgba(11,42,74,.08);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select{font:inherit}
  a{color:var(--navy-2)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px}

  /* Header */
  header{background:#f9fafb;color:var(--navy);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:76px}
  .brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--navy);min-width:0}
  .tiaa-logo{height:48px;width:auto;flex:none;display:block}
  .brand small{font-size:13px;color:var(--muted);border-left:1px solid var(--line);padding-left:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Language switch */
  .lang{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--navy);cursor:pointer;padding:6px 4px;font-weight:700;font-size:14px;flex:none}
  .lang .opt{opacity:.45;transition:opacity .15s}
  .lang .opt.on{opacity:1}
  .lang .track{width:44px;height:24px;border-radius:999px;background:#c5d0db;position:relative;transition:background .2s}
  .lang .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .lang[aria-checked="true"] .track{background:var(--teal)}
  .lang[aria-checked="true"] .knob{transform:translateX(20px)}
  .lang:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}

  .hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 60%,#0f5a73 100%);color:#fff;padding:36px 0 84px}
  .hero h1{font-size:clamp(28px,4.4vw,44px);line-height:1.1;margin:0 0 10px;max-width:760px}
  .hero h1 span{color:var(--teal-2)}
  .hero p{margin:0;color:#cfdbe7;max-width:640px;font-size:17px}
  .values{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding:0;list-style:none}
  .values li{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:#e6eef5}

  /* Tabs */
  .tabs{display:flex;gap:6px;margin-top:-56px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;white-space:nowrap;
    border:0;cursor:pointer;padding:12px 18px;border-radius:12px 12px 0 0;
    background:rgba(255,255,255,.12);color:#fff;font-weight:600;
  }
  .tab[aria-selected="true"]{background:var(--card);color:var(--navy)}
  .tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .panel{display:none;background:var(--card);border-radius:0 var(--radius) var(--radius) var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:28px}
  .panel.active{display:block}

  h2{margin:0 0 4px;font-size:22px;color:var(--navy)}
  h3{color:var(--navy)}
  .sub{margin:0 0 20px;color:var(--muted)}

  /* Explainer */
  .explain{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;background:linear-gradient(135deg,#eef9fa,#f3f6fb);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:28px}
  .explain h2{font-size:20px}
  .explain p{margin:8px 0 0}
  .aka{font-size:13px;color:var(--muted)}
  .steps{display:grid;gap:8px;align-content:start}
  .step{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
  .step .yr{font-weight:700;font-size:13px;color:var(--muted)}
  .step .what{font-size:14px}
  .step .amt{font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
  .step .earn{color:var(--teal);font-weight:700}
  .step.big{background:var(--navy);border-color:var(--navy)}
  .step.big .yr,.step.big .what{color:#cfdbe7}
  .step.big .amt{color:#fff;font-size:18px}

  /* Calculator */
  .calc{display:grid;grid-template-columns:340px 1fr;gap:28px}
  .field{margin-bottom:18px}
  .field label,.field .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:600;font-size:14px;margin-bottom:6px}
  .field output{font-variant-numeric:tabular-nums;color:var(--navy);font-weight:700;white-space:nowrap}
  .hint{font-size:12.5px;color:var(--muted);margin-top:2px}
  input[type=range]{width:100%;accent-color:var(--teal);height:28px}

  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .seg button{
    border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px;cursor:pointer;text-align:center;color:var(--ink);
  }
  .seg button b{display:block;color:var(--navy);font-size:15px}
  .seg button span{display:block;font-size:12px;color:var(--muted)}
  .seg button[aria-checked="true"]{border-color:var(--teal);background:#e9f8f9}
  .seg button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  .rates{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px;background:#fbfcfd}
  .rates h3{margin:0 0 8px;font-size:15px}
  .rate{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
  .rate:first-of-type{border-top:0}
  .rate .nm{font-weight:700;font-size:14px}
  .rate .pct{font-weight:800;color:var(--teal);font-size:18px;font-variant-numeric:tabular-nums;grid-row:span 2;align-self:center}
  .rate .ds{font-size:12.5px;color:var(--muted)}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .stat{background:var(--bg);border-radius:12px;padding:12px 14px}
  .stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
  .stat .v{font-size:clamp(18px,2.6vw,26px);font-weight:800;font-variant-numeric:tabular-nums;color:var(--navy)}
  .stat.total{background:var(--navy)}
  .stat.total .k{color:#b9cadb}.stat.total .v{color:#fff}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
  .chartbox{position:relative}
  canvas{display:block;width:100%;height:300px}
  .chartlegend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
  .chartlegend span{display:inline-flex;align-items:center;gap:6px}
  .tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;font-size:13px;padding:8px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s}
  .tip b{font-variant-numeric:tabular-nums}
  .insight{margin-top:14px;padding:12px 14px;border-left:4px solid var(--teal);background:#eef9fa;border-radius:8px;font-size:15px}

  /* Game */
  .gamehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;color:var(--navy);font-variant-numeric:tabular-nums}
  .pill.gold{background:#fff4d6;color:#8a5e00}
  .scenario{background:linear-gradient(135deg,#eef9fa,#f3f6fb);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  .scenario .who{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .scenario .q{font-size:clamp(18px,2.4vw,22px);font-weight:700;color:var(--navy);margin-top:6px}
  .scenario .q em{font-style:normal;color:var(--teal)}
  .choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .choice{
    border:2px solid var(--line);background:#fff;border-radius:12px;padding:16px;cursor:pointer;
    font-size:20px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;transition:transform .08s,border-color .15s,background .15s;
  }
  .choice:hover:not(:disabled){border-color:var(--teal);transform:translateY(-1px)}
  .choice:disabled{cursor:default}
  .choice.right{border-color:var(--good);background:#e8f7ef;color:var(--good)}
  .choice.wrong{border-color:var(--bad);background:#fbeceb;color:var(--bad)}
  .reveal{margin-top:16px;display:none}
  .reveal.show{display:block}
  .verdict{font-size:20px;font-weight:800;margin:0 0 8px}
  .verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
  .split{height:22px;border-radius:999px;overflow:hidden;display:flex;background:var(--bg);margin:10px 0 6px}
  .split div{height:100%;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
  .legend b{color:var(--ink);font-variant-numeric:tabular-nums}
  .btn{border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--teal);color:#fff}
  .btn:hover{filter:brightness(1.05)}
  .btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--line)}
  .btnrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .final{text-align:center;padding:24px 8px}
  .final .big{font-size:56px;font-weight:900;color:var(--navy);line-height:1}
  .final p{color:var(--muted)}

  /* Race */
  .racegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:12px}
  .racer{border:1px solid var(--line);border-radius:14px;padding:16px}
  .racer h3{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
  .avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
  .track{margin-top:6px}
  .lane{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:10px;margin:10px 0}
  .lane .nm{font-weight:700;font-size:14px}
  .lanebar{height:36px;background:var(--bg);border-radius:10px;position:relative;overflow:hidden}
  .lanebar .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:10px;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;color:#fff;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:0}
  .agebadge{font-size:40px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}
  .raceinfo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

  footer{color:var(--muted);font-size:12px;padding:8px 0 40px}
  .credits{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:18px;padding-top:18px}
  .credits .by{font-size:12px;color:var(--muted)}
  .credits img{display:block;width:auto}
  .teamxi{height:46px;border-radius:4px}
  .yalesom{height:64px}
  .notice{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:12.5px}
  footer p{margin:6px 0;max-width:860px}

  @media (max-width:820px){
    .calc,.explain{grid-template-columns:1fr}
    .racegrid{grid-template-columns:1fr}
  }
  @media (max-width:520px){
    .stats{grid-template-columns:1fr 1fr}
    .stat.total{grid-column:1/-1}
    .choices{grid-template-columns:1fr}
    .panel{padding:18px}
    .brand small{display:none}
    .tiaa-logo{height:36px}
    .tab{padding:10px 10px;font-size:13px}
    .lane{grid-template-columns:70px 1fr}
    .step{grid-template-columns:60px 1fr auto}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#" aria-label="TIAA">
      <img class="tiaa-logo" src="images/tiaa-logo.png" alt="TIAA" width="1252" height="386">
      <small data-i18n="brandSub"></small>
    </a>
    <button class="lang" id="lang" role="switch" aria-checked="false" aria-label="Español">
      <span class="opt" id="lang-en" lang="en">EN</span>
      <span class="track" aria-hidden="true"><span class="knob"></span></span>
      <span class="opt" id="lang-es" lang="es">ES</span>
    </button>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1 data-i18n="heroH"></h1>
    <p data-i18n="heroP"></p>
    <ul class="values">
      <li data-i18n="v1"></li><li data-i18n="v2"></li><li data-i18n="v3"></li><li data-i18n="v4"></li>
    </ul>
  </div>
</section>

<main class="wrap">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" aria-controls="p-calc" id="t-calc" data-i18n="tab1"></button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="p-game" id="t-game" data-i18n="tab2"></button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="p-race" id="t-race" data-i18n="tab3"></button>
  </div>

  <!-- CALCULATOR -->
  <section class="panel active" id="p-calc" role="tabpanel" aria-labelledby="t-calc">

    <div class="explain">
      <div>
        <h2 data-i18n="exH"></h2>
        <div class="aka" data-i18n="exAka"></div>
        <p data-i18n="exP1"></p>
        <p data-i18n="exP2"></p>
        <p data-i18n="exP3"></p>
      </div>
      <div class="steps">
        <div class="step"><span class="yr" data-i18n="stStart"></span><span class="what" data-i18n="st0"></span><span class="amt">$1,000</span></div>
        <div class="step"><span class="yr" data-i18n="stY1"></span><span class="what" data-i18n="st1"></span><span class="amt">$1,060</span></div>
        <div class="step"><span class="yr" data-i18n="stY2"></span><span class="what" data-i18n="st2"></span><span class="amt">$1,124</span></div>
        <div class="step"><span class="yr" data-i18n="stY10"></span><span class="what" data-i18n="st10"></span><span class="amt">$1,791</span></div>
        <div class="step big"><span class="yr" data-i18n="stY30"></span><span class="what" data-i18n="st30"></span><span class="amt">$5,743</span></div>
      </div>
    </div>

    <h2 data-i18n="calcH"></h2>
    <p class="sub" data-i18n="calcSub"></p>
    <div class="calc">
      <div>
        <div class="field">
          <label for="c-start"><span data-i18n="lStart"></span> <output id="o-start"></output></label>
          <input type="range" id="c-start" min="16" max="60" step="1" value="25">
        </div>
        <div class="field">
          <label for="c-retire"><span data-i18n="lRetire"></span> <output id="o-retire"></output></label>
          <input type="range" id="c-retire" min="50" max="75" step="1" value="67">
        </div>
        <div class="field">
          <label for="c-break"><span data-i18n="lBreak"></span> <output id="o-break"></output></label>
          <input type="range" id="c-break" min="0" max="15" step="1" value="0">
          <div class="hint" id="h-break"></div>
        </div>
        <div class="field">
          <label for="c-init"><span data-i18n="lInit"></span> <output id="o-init"></output></label>
          <input type="range" id="c-init" min="0" max="100000" step="500" value="1000">
        </div>
        <div class="field">
          <label for="c-month"><span data-i18n="lMonth"></span> <output id="o-month"></output></label>
          <input type="range" id="c-month" min="0" max="2000" step="25" value="200">
          <div class="hint" data-i18n="hMonth"></div>
        </div>

        <div class="rates">
          <h3 data-i18n="ratesH"></h3>
          <div class="rate"><span class="nm">TIAA Traditional</span><span class="pct">~3%</span><span class="ds" data-i18n="rTradDs"></span></div>
          <div class="rate"><span class="nm">TIAA-CREF Lifecycle 2040 Fund</span><span class="pct">~8%</span><span class="ds" data-i18n="rLifeDs"></span></div>
        </div>

        <div class="field">
          <span class="lbl" id="l-growth" data-i18n="lGrowth"></span>
          <div class="seg" role="radiogroup" aria-labelledby="l-growth" id="c-growth">
            <button type="button" role="radio" data-rate="4" aria-checked="false"><b data-i18n="low"></b><span data-i18n="about4"></span></button>
            <button type="button" role="radio" data-rate="6" aria-checked="true"><b data-i18n="med"></b><span data-i18n="about6"></span></button>
            <button type="button" role="radio" data-rate="8" aria-checked="false"><b data-i18n="high"></b><span data-i18n="about8"></span></button>
          </div>
          <div class="hint" data-i18n="hGrowth"></div>
        </div>
      </div>
      <div>
        <div class="stats">
          <div class="stat"><div class="k"><span class="dot" style="background:var(--navy-2)"></span><span data-i18n="sContrib"></span></div><div class="v" id="s-contrib">$0</div></div>
          <div class="stat"><div class="k"><span class="dot" style="background:var(--teal)"></span><span data-i18n="sGrowth"></span></div><div class="v" id="s-growth">$0</div></div>
          <div class="stat total"><div class="k" id="s-total-k"></div><div class="v" id="s-total">$0</div></div>
        </div>
        <div class="chartbox">
          <canvas id="chart" role="img"></canvas>
          <div class="tip" id="tip"></div>
        </div>
        <div class="chartlegend">
          <span><span class="dot" style="background:var(--navy-2)"></span><span data-i18n="sContrib"></span></span>
          <span><span class="dot" style="background:var(--teal)"></span><span data-i18n="sGrowth"></span></span>
          <span id="lg-break"><span class="dot" style="background:var(--break)"></span><span data-i18n="lgBreak"></span></span>
        </div>
        <div class="insight" id="insight"></div>
      </div>
    </div>
  </section>

  <!-- GAME -->
  <section class="panel" id="p-game" role="tabpanel" aria-labelledby="t-game">
    <div class="gamehead">
      <div>
        <h2 data-i18n="gH"></h2>
        <p class="sub" style="margin:0" data-i18n="gSub"></p>
      </div>
      <div class="pills">
        <span class="pill" id="g-round"></span>
        <span class="pill gold" id="g-score"></span>
        <span class="pill" id="g-streak"></span>
      </div>
    </div>
    <div id="g-play">
      <div class="scenario">
        <div class="who" id="g-who"></div>
        <div class="q" id="g-q"></div>
      </div>
      <div class="choices" id="g-choices"></div>
      <div class="reveal" id="g-reveal">
        <p class="verdict" id="g-verdict"></p>
        <div class="split"><div id="g-bar-c" style="background:var(--navy-2)"></div><div id="g-bar-g" style="background:var(--teal)"></div></div>
        <div class="legend">
          <span><span class="dot" style="background:var(--navy-2)"></span> <span data-i18n="gC"></span> <b id="g-c"></b></span>
          <span><span class="dot" style="background:var(--teal)"></span> <span data-i18n="sGrowth"></span> <b id="g-g"></b></span>
        </div>
        <p id="g-lesson" style="margin:12px 0 0"></p>
        <div class="btnrow"><button class="btn" id="g-next"></button></div>
      </div>
    </div>
    <div id="g-final" class="final" hidden>
      <div class="sub" style="margin:0 0 6px" data-i18n="gFinal"></div>
      <div class="big" id="g-finalscore">0</div>
      <p id="g-finalmsg"></p>
      <div class="btnrow" style="justify-content:center">
        <button class="btn" id="g-again" data-i18n="gAgain"></button>
        <button class="btn ghost" id="g-tocalc" data-i18n="gToCalc"></button>
      </div>
    </div>
  </section>

  <!-- RACE -->
  <section class="panel" id="p-race" role="tabpanel" aria-labelledby="t-race">
    <h2 data-i18n="rH"></h2>
    <p class="sub" data-i18n="rSub"></p>
    <div class="racegrid">
      <div class="racer">
        <h3><span class="avatar" style="background:var(--teal)">A</span> <span data-i18n="rAnaH"></span></h3>

  /* Month-by-month simulation. Savings are added at the end of each month;
     growth is credited monthly. skipYear(y) returns true for years with no saving. */
  function simulate(initial, monthly, ratePct, years, skipYear){
    var mRate = ratePct/100/12;
    var bal = initial, contrib = initial;
    var rows = [{year:0, balance:bal, contrib:contrib}];
    for(var y=1; y<=years; y++){
      var saving = !(skipYear && skipYear(y-1));
      for(var m=0; m<12; m++){
        bal = bal*(1+mRate) + (saving ? monthly : 0);
        if(saving) contrib += monthly;
      }
      rows.push({year:y, balance:bal, contrib:contrib});
    }
    return rows;
  }

  /* Low / Medium / High picker */
  function segment(el, onChange){
    var btns = el.querySelectorAll("button");
    btns.forEach(function(b, i){
      b.addEventListener("click", function(){ set(b); });
      b.addEventListener("keydown", function(e){
        if(e.key === "ArrowRight" || e.key === "ArrowLeft"){
          e.preventDefault();
          var n = btns[(i + (e.key === "ArrowRight" ? 1 : btns.length-1)) % btns.length];
          n.focus(); set(n);
        }
      });
    });
    function set(b){
      btns.forEach(function(x){ x.setAttribute("aria-checked", x === b); x.tabIndex = x === b ? 0 : -1; });
      onChange();
    }
    btns.forEach(function(x){ x.tabIndex = x.getAttribute("aria-checked") === "true" ? 0 : -1; });
    return function(){ return +el.querySelector('[aria-checked="true"]').dataset.rate; };
  }

  /* ---------------- Tabs ---------------- */
  var tabs = document.querySelectorAll(".tab");
  function selectTab(tab){
    tabs.forEach(function(t){
      var on = t === tab;
      t.setAttribute("aria-selected", on);
      $(t.getAttribute("aria-controls")).classList.toggle("active", on);
    });
    if(tab.id === "t-calc") drawChart();
  }
  tabs.forEach(function(t, i){
    t.addEventListener("click", function(){ selectTab(t); });
    t.addEventListener("keydown", function(e){
      if(e.key === "ArrowRight" || e.key === "ArrowLeft"){
        var next = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length-1)) % tabs.length];
        next.focus(); selectTab(next);
      }
    });
  });

  /* ---------------- Calculator ---------------- */
  var cStart=$("c-start"), cRetire=$("c-retire"), cBreak=$("c-break"), cInit=$("c-init"), cMonth=$("c-month");
  var calcRate = segment($("c-growth"), function(){ updateCalc(); });
  var canvas=$("chart"), ctx=canvas.getContext("2d"), tip=$("tip");
  var data=[], plot={}, startAge=25, brk=null;

  function updateCalc(){
    if(+cRetire.value <= +cStart.value) cRetire.value = Math.min(75, +cStart.value + 1);
    startAge = +cStart.value;
    var years = +cRetire.value - startAge;
    var breakYrs = Math.min(+cBreak.value, years);
    // family time is assumed to begin 5 years after you start working
    var bStart = Math.min(5, years - breakYrs);
    brk = breakYrs > 0 ? {from:bStart, to:bStart + breakYrs} : null;

    $("o-start").textContent = startAge;
    $("o-retire").textContent = cRetire.value;
    $("o-break").textContent = +cBreak.value === 0 ? T.none : T.years(+cBreak.value);
    $("h-break").textContent = brk ? T.hBreakAt(startAge + brk.from, startAge + brk.to) : T.hBreak;
    $("o-init").textContent = money(+cInit.value);
    $("o-month").textContent = money(+cMonth.value);
    $("lg-break").hidden = !brk;

    var rate = calcRate();
    data = simulate(+cInit.value, +cMonth.value, rate, years,
      brk ? function(y){ return y >= brk.from && y < brk.to; } : null);
    var last = data[data.length-1];
    $("s-contrib").textContent = money(last.contrib);
    $("s-growth").textContent = money(last.balance - last.contrib);
    $("s-total-k").textContent = T.sTotal(cRetire.value);
    $("s-total").textContent = money(last.balance);

    var cross = data.find(function(d){ return d.year > 0 && d.balance - d.contrib > d.contrib; });
    var msg;
    if(last.balance <= 0){
      msg = T.insEmpty;
    } else {
      var perDollar = last.contrib > 0 ? last.balance/last.contrib : 0;
      msg = T.insPerDollar(perDollar.toFixed(2));
      if(cross) msg += T.insCross(startAge + cross.year);
      if(brk){
        var noBreak = simulate(+cInit.value, +cMonth.value, rate, years)[years].balance;
        msg += T.insBreak(breakYrs, money(noBreak - last.balance));
      }
      msg += T.insLegacy;
    }
    $("insight").innerHTML = msg;
    drawChart();
  }

  function drawChart(hoverIdx){
    var w = canvas.clientWidth; if(!w) return;
    var h = canvas.clientHeight || 300;
    var dpr = window.devicePixelRatio || 1;
    if(canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){
      canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);

    var pad = {l:56, r:26, t:12, b:28};
    var pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
    var maxV = Math.max.apply(null, data.map(function(d){return d.balance;})) || 1;
    var step = niceStep(maxV/4);
    var top = Math.ceil(maxV/step)*step;
    var n = data.length - 1 || 1;
    var x = function(i){ return pad.l + pw*i/n; };
    var y = function(v){ return pad.t + ph - ph*v/top; };
    plot = {x:x, pad:pad, pw:pw, n:n, y:y};

    if(brk){
      ctx.fillStyle = cssVar("--break");
      ctx.fillRect(x(brk.from), pad.t, x(brk.to) - x(brk.from), ph);
    }

    ctx.font = "12px -apple-system,Segoe UI,Roboto,Arial,sans-serif";
    ctx.fillStyle = cssVar("--muted"); ctx.strokeStyle = cssVar("--line"); ctx.lineWidth = 1;
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    for(var v=0; v<=top+1e-6; v+=step){
      var yy = Math.round(y(v))+.5;
      ctx.beginPath(); ctx.moveTo(pad.l, yy); ctx.lineTo(w-pad.r, yy); ctx.stroke();
      ctx.fillText(short(v), pad.l-8, yy);
    }
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    var xStep = Math.max(1, Math.ceil(n/Math.min(8, Math.floor(pw/56))));
    for(var i=0;i<=n;i+=xStep){ ctx.fillText(T.age(startAge + i), x(i), h-pad.b+8); }

    area(function(d){return d.contrib;}, function(){return 0;}, cssVar("--navy-2"));
    area(function(d){return d.balance;}, function(d){return d.contrib;}, cssVar("--teal"));

    ctx.beginPath();
    data.forEach(function(d,i){ i ? ctx.lineTo(x(i), y(d.balance)) : ctx.moveTo(x(i), y(d.balance)); });
    ctx.strokeStyle = cssVar("--navy"); ctx.lineWidth = 2; ctx.stroke();

    if(hoverIdx != null && data[hoverIdx]){
      var d = data[hoverIdx], hx = x(hoverIdx);
      ctx.strokeStyle = cssVar("--navy"); ctx.lineWidth = 1; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(hx, pad.t); ctx.lineTo(hx, pad.t+ph); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = "#fff"; ctx.strokeStyle = cssVar("--navy"); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(hx, y(d.balance), 5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    }

    function area(topFn, botFn, color){
      ctx.beginPath();
      data.forEach(function(d,i){ i ? ctx.lineTo(x(i), y(topFn(d))) : ctx.moveTo(x(i), y(topFn(d))); });
      for(var j=data.length-1;j>=0;j--) ctx.lineTo(x(j), y(botFn(data[j])));
      ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    }
  }
  function niceStep(raw){
    var p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    var f = raw/p;
    return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
  }

  canvas.addEventListener("mousemove", function(e){
    var rect = canvas.getBoundingClientRect();
    var i = Math.round((e.clientX - rect.left - plot.pad.l)/plot.pw*plot.n);
    if(i<0 || i>plot.n){ hideTip(); return; }
    var d = data[i];
    drawChart(i);
    tip.innerHTML = "<div>" + T.age(startAge + d.year) + "</div><b>" + money(d.balance) + "</b><div style='opacity:.8'>" +
      money(d.contrib) + " " + T.tipIn + " &middot; " + money(d.balance-d.contrib) + " " + T.tipGrowth + "</div>";
    tip.style.left = Math.min(Math.max(plot.x(i), 90), rect.width-90) + "px";
    tip.style.top = plot.y(d.balance) + "px";
    tip.style.opacity = 1;
  });
  canvas.addEventListener("mouseleave", hideTip);
  function hideTip(){ tip.style.opacity = 0; drawChart(); }

  [cStart,cRetire,cBreak,cInit,cMonth].forEach(function(el){ el.addEventListener("input", updateCalc); });
  window.addEventListener("resize", function(){ drawChart(); });

  /* ---------------- Guess the total game ---------------- */
  var ROUNDS = 5;
  var names = ["María","Sofía","Lucía","Valentina","Camila","Isabel","Gabriela","Carmen","Elena","Rosa","Ximena","Daniela"];
  var g;

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function rnd(min,max,step){ return min + step*Math.floor(Math.random()*((max-min)/step+1)); }
  function roundTo(v){
    var mag = Math.pow(10, Math.floor(Math.log10(v)) - 1);
    return Math.round(v/mag)*mag;
  }

  function newRound(){
    g.round++;
    var name; do{ name = pick(names); } while(g.used[name] && Object.keys(g.used).length < names.length);
    g.used[name] = 1;
    var monthly = rnd(100, 800, 50);
    var rate = pick([4,6,8]);
    var years = rnd(15, 40, 5);
    var rows = simulate(0, monthly, rate, years);
    var last = rows[rows.length-1];
    var correct = last.balance, contrib = last.contrib;

    // Wrong answers based on common mistakes: no growth at all, or too little growth
    var simple = contrib + contrib*(rate/100)*years/2;
    var opts = [correct, contrib, simple, correct*(1.55 + Math.random()*0.35)].map(roundTo);
    for(var i=1;i<opts.length;i++){
      for(var j=0;j<i;j++){
        if(Math.abs(opts[i]-opts[j])/opts[j] < 0.12) opts[i] = roundTo(opts[i]*1.3);
      }
    }
    g.cur = {
      name:name, career:Math.floor(Math.random()*STR.en.careers.length),
      monthly:monthly, rate:rate, years:years,
      value:opts[0], contrib:contrib, growth:correct-contrib,
      guess:null, ok:null, gained:0
    };
    var shuffled = opts.map(function(v,k){return {v:v, ok:k===0};}).sort(function(){return Math.random()-.5;});

    var box = $("g-choices"); box.innerHTML = "";
    shuffled.forEach(function(o){
      var b = document.createElement("button");
      b.className = "choice"; b.textContent = money(o.v);
      b.dataset.ok = o.ok ? "1" : "";
      b.dataset.v = o.v;
      b.addEventListener("click", function(){ answer(b); });
      box.appendChild(b);
    });
    $("g-reveal").classList.remove("show");
    $("g-bar-c").style.width = 0; $("g-bar-g").style.width = 0;
    renderGame();
  }

  function answer(btn){
    var c = g.cur;
    c.ok = btn.dataset.ok === "1";
    c.guess = +btn.dataset.v;
    document.querySelectorAll("#g-choices .choice").forEach(function(b){
      b.disabled = true;
      if(b.dataset.ok === "1") b.classList.add("right");
    });
    if(!c.ok) btn.classList.add("wrong");
    if(c.ok){ g.streak++; c.gained = 100 + (g.streak-1)*50; g.score += c.gained; } else { g.streak = 0; }
    c.streakAt = g.streak;
    g.best = Math.max(g.best, g.streak);
    renderGame();
    $("g-reveal").classList.add("show");
    var total = c.contrib + c.growth;
    requestAnimationFrame(function(){
      $("g-bar-c").style.width = (c.contrib/total*100) + "%";
      $("g-bar-g").style.width = (c.growth/total*100) + "%";
    });
    $("g-next").focus({preventScroll:true});
  }

  // Writes every piece of game text from state, so it can be redrawn in either language
  function renderGame(){
    if(!g || !g.cur) return;
    var c = g.cur;
    $("g-round").textContent = T.round(g.round, ROUNDS);
    $("g-score").textContent = T.pts(g.score);
    $("g-streak").textContent = T.streak(g.streak);
    $("g-who").textContent = c.name + ", " + T.careers[c.career];
    $("g-q").innerHTML = T.gQ(money(c.monthly), c.years, T.growthWord[c.rate], c.rate);
    if(c.guess != null){
      var v = $("g-verdict");
      v.className = "verdict " + (c.ok ? "ok" : "no");
      v.textContent = c.ok ? (c.streakAt > 1 ? T.gRightStreak(c.streakAt, c.gained) : T.gRight)
        : (c.guess < c.value ? T.gLow : T.gHigh);
      var total = c.contrib + c.growth, mult = (total/c.contrib).toFixed(1);
      $("g-c").textContent = money(c.contrib);
      $("g-g").textContent = money(c.growth);
      $("g-lesson").innerHTML = Math.abs(c.guess - roundTo(c.contrib)) < 1
        ? T.gLessonContrib(c.name, mult)
        : T.gLesson(c.name, money(c.contrib), money(total), mult);
      $("g-next").textContent = g.round >= ROUNDS ? T.gSee : T.gNext;
    }
    if(g.done){
      var max = 0; for(var i=0;i<ROUNDS;i++) max += 100 + i*50;
      var msg = g.score === max ? T.gPerfect : g.score >= max*0.5 ? T.gGood : T.gTry;
      $("g-finalscore").textContent = g.score;
      $("g-finalmsg").textContent = msg + T.gBest(g.best);
    }
  }

  $("g-next").addEventListener("click", function(){
    if(g.round >= ROUNDS){
      g.done = true;
      $("g-play").hidden = true; $("g-final").hidden = false;
      renderGame();
    } else { newRound(); }
  });
  function resetGame(){
    g = {round:0, score:0, streak:0, best:0, cur:null, used:{}, done:false};
    $("g-play").hidden = false; $("g-final").hidden = true;
    newRound();
  }
  $("g-again").addEventListener("click", resetGame);
  $("g-tocalc").addEventListener("click", function(){ selectTab($("t-calc")); });

  /* ---------------- Start early vs. start late race ---------------- */
  var RET = 67;
  var rA=$("r-a-start"), rAy=$("r-a-yrs"), rJ=$("r-j-start"), rAmt=$("r-amt");
  var raceRate = segment($("r-growth"), function(){ resetRace(); });
  var prediction = null, racing = null, raceDone = null;

  function raceSeries(){
    var mRate = raceRate()/100/12;
    var amt = +rAmt.value;
    var aStart=+rA.value, aEnd=aStart + (+rAy.value), jStart=+rJ.value;
    var startAge = Math.min(aStart, jStart);
    var a=0, j=0, aIn=0, jIn=0, out=[];
    out.push({age:startAge, a:0, j:0});
    for(var age=startAge; age<RET; age++){
      for(var m=0;m<12;m++){
        a *= 1+mRate; j *= 1+mRate;
        if(age>=aStart && age<aEnd){ a += amt; aIn += amt; }
        if(age>=jStart){ j += amt; jIn += amt; }
      }
      out.push({age:age+1, a:a, j:j});
    }
    return {rows:out, aIn:aIn, jIn:jIn};
  }

  function updateRaceLabels(keepResult){
    if(+rA.value + (+rAy.value) > RET) rAy.value = RET - rA.value;
    $("o-a-start").textContent = rA.value;
    $("o-a-yrs").textContent = T.rAyrs(+rAy.value, +rA.value + (+rAy.value));
    $("o-j-start").textContent = rJ.value;
    $("o-j-yrs").textContent = T.rJyrs(RET - rJ.value);
    $("o-amt").textContent = money(+rAmt.value);
    if(keepResult !== true) resetRace();
  }
  function resetRace(){
    if(racing) cancelAnimationFrame(racing); racing = null;
    raceDone = null;
    $("r-fill-a").style.width = 0; $("r-fill-a").textContent = "";
    $("r-fill-j").style.width = 0; $("r-fill-j").textContent = "";
    $("r-age").textContent = Math.min(+rA.value, +rJ.value);
    $("r-result").hidden = true;
  }

  document.querySelectorAll("#r-predict [data-pick]").forEach(function(b){
    b.addEventListener("click", function(){
      prediction = b.dataset.pick;
      document.querySelectorAll("#r-predict [data-pick]").forEach(function(x){
        x.classList.toggle("ghost", x !== b);
      });
    });
  });

  $("r-go").addEventListener("click", function(){
    resetRace();
    var s = raceSeries(), rows = s.rows;
    var final = rows[rows.length-1];
    var max = Math.max(final.a, final.j, 1);
    var dur = Math.max(2200, rows.length*90), t0 = null;
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function frame(ts){
      if(!t0) t0 = ts;
      var p = reduce ? 1 : Math.min(1, (ts-t0)/dur);
      var fi = p*(rows.length-1), i0 = Math.floor(fi), i1 = Math.min(i0+1, rows.length-1), f = fi-i0;
      var a = rows[i0].a + (rows[i1].a-rows[i0].a)*f;
      var j = rows[i0].j + (rows[i1].j-rows[i0].j)*f;
      setFill($("r-fill-a"), a, max); setFill($("r-fill-j"), j, max);
      $("r-age").textContent = rows[Math.round(fi)].age;
      if(p<1) racing = requestAnimationFrame(frame);
      else {
        racing = null;
        raceDone = {final:final, s:s, ay:+rAy.value, jy:RET - rJ.value, pred:prediction};
        renderRaceResult();
      }
    }
    racing = requestAnimationFrame(frame);
  });
  function setFill(el, v, max){
    el.style.width = (v/max*100) + "%";
    el.textContent = v/max > 0.22 ? money(v) : "";
  }
  function renderRaceResult(){
    if(!raceDone) return;
    var final = raceDone.final, s = raceDone.s;
    var winner = final.a > final.j ? "A" : "J";
    var html = raceDone.pred ? (raceDone.pred === winner ? T.rCalled : T.rSurprise) : "";
    html += T.rMore(winner === "A" ? "Ana" : "Julia", money(Math.max(final.a, final.j)), money(Math.min(final.a, final.j)));
    html += T.rPutIn(money(s.aIn), raceDone.ay, money(s.jIn), raceDone.jy);
    if(winner === "A") html += T.rAWins(money(s.jIn - s.aIn));
    else if(s.aIn < s.jIn) html += T.rJWins((final.a/s.aIn).toFixed(1), (final.j/s.jIn).toFixed(1));
    else html += T.rTie;
    $("r-result").innerHTML = html; $("r-result").hidden = false;
  }

  [rA,rAy,rJ,rAmt].forEach(function(el){ el.addEventListener("input", updateRaceLabels); });

  /* ---------------- Start ---------------- */
  applyStatic();
  updateCalc();
  updateRaceLabels();
  resetGame();
})();
</script>
</body>
</html>
